
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime property</title> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #1A1A1A; --g: #C9A961; --r: #B33A3A; --bg: #F5F5F5; --w: #FFF;} 
        body {font-family: 'Inter', sans-serif; margin: 0; color: var(--p);}
        a {text-decoration: none; color: inherit;}
        
        header {
            background: var(--p); 
            color: var(--w); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100;
        } 
        
        .logo-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .main-logo {
            height: 40px;
            width: 140px;
            object-fit: cover;
            object-position: center;
        }
        
        nav a {margin-left: 20px; font-size: 14px;} 
        .btn-outline {border: 1px solid var(--g); padding: 5px 15px; border-radius: 4px; color: var(--g) !important;}
        .hero {background: var(--p); color: var(--w); text-align: center; padding: 80px 20px;} 
        .hero h1 span { color: var(--g); } 
        .hero p {color: #aaa; margin: 15px 0 25px;}
        .btn {background: var(--g); color: var(--p); padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;}
        .btn-danger {background: var(--r); color: var(--w);}
        .btn-sm {padding: 6px 12px; font-size: 12px;}
        .container {max-width: 1100px; margin: 0 auto; padding: 40px 20px;}
        .section {padding: 60px 0;}
        .grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;}
        .card {background: var(--w); border: 1px solid #eee; border-radius: 8px; padding: 20px;}
        .price {color: var(--g); font-weight: bold; font-size: 18px;}
        .table-box {background: var(--w); border: 1px solid #eee; border-radius: 8px; overflow: hidden;}
        table {width: 100%; border-collapse: collapse;}
        th, td {padding: 12px; text-align: left; border-bottom: 1px solid #eee;}
        th {background: var(--bg); font-size: 12px; text-transform: uppercase;}
        .badge {padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;}
        .in {background: #d1fae5; color: #065f46;}
        .out {background: #fee2e2; color: var(--r);}
        .siap-huni {background: #fef3c7; color: #92400e;}
        .siap-kosong {background: #f3e8ff; color: #6b21a8;}
        .filter-bar {background: var(--bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;}
        .filter-bar input, .filter-bar select {padding: 8px; border: 1px solid #ddd; border-radius: 4px;}
        input, select, textarea {width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;}
        .login-box {max-width: 400px; margin: 80px auto; background: var(--bg); padding: 40px; border-radius: 8px; text-align: center;}
        #toast {visibility: hidden; min-width: 250px; background: #333; color: #FFF; text-align: center; border-radius: 4px; padding: 16px;
        position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%);}
        #toast.show {visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s;}
        @keyframes fadein {from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;}}
        @keyframes fadeout {from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;}}
        .modal {display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);}
        .modal-content {background: var(--w); margin: 10% auto; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px;}
        .close {float: right; font-size: 28px; font-weight: bold; cursor: pointer;}
        footer {text-align: center; color: #888; padding: 40px 0; border-top: 1px solid #eee;}
        #tombol-dashboard-nav {display: none; color: #C9A961 !important; font-weight: bold; margin-left: 20px;}
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo-container" onclick="go('home')">
            <img src="https://media.discordapp.net/attachments/1504546422165344356/1509473595653492767/Desain_tanpa_judul_33.png?ex=6a306095&is=6a2f0f15&hm=c136cc73cd7c9e356f8daddeb1f57bdd57ba2b68e779486dde28db3d7177e7ad&=&format=webp&quality=lossless&width=1154&height=769" alt="Prime Property Logo" class="main-logo">
        </a>
        <nav id="nav">
            <a href="#" onclick="go('home')">Beranda</a>
            <a href="#" onclick="go('about')">Tentang</a>
            <a href="#" onclick="go('contact')">Kontak</a>
            <a href="#" onclick="go('login')" class="btn-outline" id="tombol-login-nav">Login</a>
            <a href="#" id="tombol-dashboard-nav" onclick="go('dashboard')">Dashboard</a>
        </nav>
    </header>
    
    <div id="app"></div>
    <div id="toast"></div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script>
        let properties = [
            { id: 1, nama: "Aston Villas", group: "Mentari", lebar: 4.5, panjang: 21.5, hadap: "Utara", tipe: "Villa", tingkat: 2, harga: 1350000000, carport: true, status: "in_stock", siap: "siap_huni", kawasan: "Kratakau", deletedAt: null},
            { id: 2, nama: "Bayan Tree", group: "Permai", lebar: 6, panjang: 11, hadap: "Selatan", tipe: "Ruko", tingkat: 3, carport: false, harga: 2200000000, status: "sold_out", siap: "siap_kosong", kawasan: "Pancing", deletedAt: null},
            { id: 3, nama: "Ruko Helvetia", group: "-", lebar: 5, panjang: 12, hadap: "Timur", tipe: "Ruko", tingkat: 1, carport: true, harga: 1500000000, status: "in_stock", siap: "siap_huni", kawasan: "Helvetia", deletedAt: null},
        ];

        let currentUser = { role: 'guest' };

        function updateNav() {
            const tombolDashboard = document.getElementById('tombol-dashboard-nav');
            const tombolLogin = document.getElementById('tombol-login-nav');
            if (currentUser && currentUser.role !== 'guest') {
                tombolDashboard.style.display = 'inline-block';
                tombolLogin.style.display = 'none';
            } else {
                tombolDashboard.style.display = 'none';
                tombolLogin.style.display = 'inline-block';
            }
        }

        function go(page) {
            const app = document.getElementById('app');

            if (page === 'home') {
                const cards = properties.filter(p => p.status === "in_stock" && !p.deletedAt).slice(0,6).map(renderCard).join('');
                app.innerHTML = `
                    <div class="hero">
                        <h1>Solusi Properti <span>Berkualitas</span></h1>
                        <p>Temukan rumah, villa, dan ruko idaman terbaik anda</p>
                        <button class="btn" onclick="go('login')">Login Agent</button>
                    </div>
                    <div class="container section">
                        <h2 style="text-align:center;margin-bottom:24px;">Properti Unggulan</h2>
                        <div class="grid">${cards}</div>
                    </div>
                    <div class="container section">
                        <h2 style="text-align:center;margin-bottom:24px;">Mengapa Prime Property?</h2>
                        <div class="grid">
                            <div class="card"><h3>Lokasi Strategis</h3><p>Properti di lokasi premium dengan akses terbaik.</p></div>
                            <div class="card"><h3>Harga Transparan</h3><p>Tidak ada biaya tersembunyi, semua jelas dari awal.</p></div>
                            <div class="card"><h3>Layanan Professional</h3><p>Tim kami siap membantu 24/7 untuk kebutuhan Anda.</p></div>
                        </div>
                    </div>
                    <footer class="container"><p>&copy; 2026 Prime Property</p></footer>
                `;

            } else if (page === 'about') {
                app.innerHTML = '<div class="container section"><h2>Tentang Kami</h2><p>Prime Property adalah agen properti terpercaya di Medan.</p></div>';

            } else if (page === 'contact') {
                app.innerHTML = `
                    <div class="container section">
                        <h2>Kontak Kami</h2>
                        <p>Jl. Pancing No. 123, Medan</p>
                        <form onsubmit="handleContact(event)">
                            <input placeholder="Nama" required>
                            <input type="email" placeholder="Email" required>
                            <input placeholder="HP" required>
                            <textarea placeholder="Pesan" required></textarea>
                            <button class="btn">Kirim</button>
                        </form>
                    </div>
                `;

            } else if (page === 'login') {
                app.innerHTML = `
                    <div class="login-box">
                        <h2>Login</h2>
                        <form onsubmit="handleLogin(event)">
                            <input placeholder="Email" required>
                            <input type="password" placeholder="Password" required>
                            <button class="btn" style="width:100%;">Masuk</button>
                        </form>
                    </div>
                `;

            } else if (page === 'dashboard') {
                if (currentUser.role === 'guest') return go('login');
                const roleLabel = currentUser.role === 'superadmin' ? 'Superadmin' : 'Admin';
                const btnTambah = currentUser.role === 'superadmin' ? '<button class="btn" style="margin-left:8px;" onclick="openFormAdd()">+ Tambah</button>' : '';
                app.innerHTML = `
                    <div class="container">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                            <h2>Daftar Properti (${roleLabel})</h2>
                            <div>
                                <button class="btn-outline" onclick="logout()">Logout</button>
                                ${btnTambah}
                            </div>
                        </div>
                        <div class="filter-bar">
                            <input id="s" placeholder="Cari..." oninput="renderTable()">
                            <select id="k" onchange="renderTable()">
                                <option value="">Kawasan</option>
                                <option>Kratakau</option>
                                <option>Pancing</option>
                                <option>Helvetia</option>
                            </select>
                            <select id="st" onchange="renderTable()">
                                <option value="">Status</option>
                                <option value="in_stock">In Stock</option>
                                <option value="sold_out">Sold Out</option>
                            </select>
                            <select id="siap" onchange="renderTable()">
                                <option value="">Siap</option>
                                <option value="siap_huni">Siap Huni</option>
                                <option value="siap_kosong">Siap Kosong</option>
                            </select>
                            <button class="btn" onclick="resetFilter()">Reset</button>
                        </div>
                        <div class="table-box">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nama</th><th>Group</th><th>Ukuran</th><th>Harga</th>
                                        <th>Hadap</th><th>Tingkat</th><th>Carport</th><th>Tipe</th>
                                        <th>Status</th><th>Siap</th><th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody"></tbody>
                            </table>
                        </div>
                    </div>
                `;
                renderTable();
            }

            updateNav();
        }

        function renderCard(p) {
            return `<div class="card"><h3>${p.nama}</h3><p class="price">Rp ${p.harga.toLocaleString("id-ID")}</p><small>${p.kawasan}</small></div>`;
        }

        function resetFilter() {
            document.getElementById('s').value = '';
            document.getElementById('k').value = '';
            document.getElementById('st').value = '';
            document.getElementById('siap').value = '';
            renderTable();
        }

        function renderTable() {
            const s = document.getElementById('s').value.toLowerCase();
            const k = document.getElementById('k').value;
            const st = document.getElementById('st').value;
            const siap = document.getElementById('siap').value;
            const tbody = document.getElementById('tbody');
            if (!tbody) return;

            tbody.innerHTML = properties.filter(p => {
                if (p.deletedAt) return false;
                if (s && !p.nama.toLowerCase().includes(s) && !p.group.toLowerCase().includes(s) && !p.kawasan.toLowerCase().includes(s)) return false;
                if (k && p.kawasan !== k) return false;
                if (st && p.status !== st) return false;
                if (siap && p.siap !== siap) return false;
                return true;
            }).map(p => {
                const statusClass = p.status === 'in_stock' ? 'in' : 'out';
                const statusText = p.status === 'in_stock' ? 'In Stock' : 'Sold Out';
                const siapClass = p.siap === 'siap_huni' ? 'siap-huni' : 'siap-kosong';
                const siapText = p.siap === 'siap_huni' ? 'Siap Huni' : 'Siap Kosong';
                const btnEdit = currentUser.role === 'superadmin' ? `<button class="btn btn-sm" onclick="event.stopPropagation(); editProm(${p.id})">Edit</button> ` : '';
                const btnDel = currentUser.role === 'superadmin' ? `<button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteProm(${p.id})">Hapus</button>` : '';
                return `<tr onclick="showDetail(${p.id})" style="cursor:pointer;">
                    <td>${p.nama}</td><td>${p.group}</td><td>${p.lebar}x${p.panjang}</td>
                    <td>Rp ${p.harga.toLocaleString("id-ID")}</td><td>${p.hadap}</td>
                    <td>${p.tingkat}</td><td>${p.carport ? 'Ya' : 'Tidak'}</td><td>${p.tipe}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td><span class="badge ${siapClass}">${siapText}</span></td>
                    <td>${btnEdit}${btnDel}</td>
                </tr>`;
            }).join('');
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const email = inputs[0].value.trim();
            const password = inputs[1].value.trim();

            if (email === "admin@prime.com" && password === "admin123") {
                currentUser = { role: 'admin' };
                go('dashboard');
                showToast('Login Admin Berhasil!');
            } else if (email === "superadmin@prime.com" && password === "superadmin123") {
                currentUser = { role: 'superadmin' };
                go('dashboard');
                showToast('Login Superadmin Berhasil!');
            } else {
                alert('Email atau Password salah!');
            }
        }

        function handleContact(e) {
            e.preventDefault();
            alert('Pesan Terkirim!');
        }

        function openFormAdd() {
            document.getElementById('modalBody').innerHTML = `
                <h3>Tambah Properti</h3>
                <form onsubmit="saveProm(event)">
                    <input id="nama" placeholder="Nama" required>
                    <input id="group" placeholder="Group">
                    <input id="lebar" placeholder="Lebar" required>
                    <input id="panjang" placeholder="Panjang" required>
                    <input id="harga" placeholder="Harga" required>
                    <select id="Kawasan">
                        <option>Kratakau</option>
                        <option>Pancing</option>
                        <option>Helvetia</option>
                    </select>
                    <select id="tipe">
                        <option>Villa</option>
                        <option>Ruko</option>
                        <option>Rumah</option>
                    </select>
                    <select id="hadap">
                        <option>Utara</option><option>Selatan</option><option>Timur</option><option>Barat</option>
                    </select>
                    <input id="tingkat" placeholder="Tingkat" type="number" value="1">
                    <select id="status_add">
                        <option value="in_stock">In Stock</option>
                        <option value="sold_out">Sold Out</option>
                    </select>
                    <select id="siap_add">
                        <option value="siap_huni">Siap Huni</option>
                        <option value="siap_kosong">Siap Kosong</option>
                    </select>
                    <button class="btn" style="width:100%;margin-top:10px;">Simpan</button>
                </form>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function editProm(id) {
            const p = properties.find(x => x.id === id);
            document.getElementById('modalBody').innerHTML = `
                <h3>Edit Properti</h3>
                <form onsubmit="saveEdit(event, ${id})">
                    <input id="enama" placeholder="Nama" value="${p.nama}">
                    <input id="eharga" placeholder="Harga" value="${p.harga}">
                    <select id="estatus">
                        <option value="in_stock" ${p.status === 'in_stock' ? 'selected' : ''}>In Stock</option>
                        <option value="sold_out" ${p.status === 'sold_out' ? 'selected' : ''}>Sold Out</option>
                    </select>
                    <select id="esiap">
                        <option value="siap_huni" ${p.siap === 'siap_huni' ? 'selected' : ''}>Siap Huni</option>
                        <option value="siap_kosong" ${p.siap === 'siap_kosong' ? 'selected' : ''}>Siap Kosong</option>
                    </select>
                    <button class="btn" style="width:100%;margin-top:10px;">Simpan</button>
                </form>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function showDetail(id) {
            const p = properties.find(x => x.id === id);
            document.getElementById('modalBody').innerHTML = `
                <h3>${p.nama}</h3>
                <p><strong>Harga:</strong> Rp ${p.harga.toLocaleString("id-ID")}</p>
                <p><strong>Kawasan:</strong> ${p.kawasan}</p>
                <p><strong>Hadap:</strong> ${p.hadap}</p>
                <p><strong>Tipe:</strong> ${p.tipe}</p>
                <p><strong>Ukuran:</strong> ${p.lebar}x${p.panjang}</p>
                <p><strong>Tingkat:</strong> ${p.tingkat}</p>
                <p><strong>Carport:</strong> ${p.carport ? 'Ya' : 'Tidak'}</p>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function saveProm(e) {
            e.preventDefault();
            properties.push({
                id: Date.now(),
                nama: document.getElementById('nama').value,
                group: document.getElementById('group').value || '-',
                lebar: parseFloat(document.getElementById('lebar').value),
                panjang: parseFloat(document.getElementById('panjang').value),
                harga: parseInt(document.getElementById('harga').value),
                kawasan: document.getElementById('Kawasan').value,
                tipe: document.getElementById('tipe').value,
                hadap: document.getElementById('hadap').value,
                tingkat: parseInt(document.getElementById('tingkat').value),
                carport: false,
                status: document.getElementById('status_add').value,
                siap: document.getElementById('siap_add').value,
                deletedAt: null,
                created_at: new Date(),
                updated_at: new Date()
            });
            closeModal();
            renderTable();
            showToast('Properti berhasil ditambahkan!');
        }

        function saveEdit(e, id) {
            e.preventDefault();
            let p = properties.find(x => x.id === id);
            p.nama = document.getElementById('enama').value;
            p.harga = parseInt(document.getElementById('eharga').value);
            p.status = document.getElementById('estatus').value;
            p.siap = document.getElementById('esiap').value;
            p.updated_at = new Date();
            closeModal();
            renderTable();
            showToast('Properti diupdate!');
        }

        function deleteProm(id) {
            if (confirm('Yakin dihapus?')) {
                let p = properties.find(x => x.id === id);
                p.deletedAt = new Date();
                renderTable();
                showToast('Properti dihapus!');
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function logout() {
            currentUser = { role: 'guest' };
            go('home');
            showToast('Berhasil Logout!');
        }

        go('home');
    </script>
</body>
</html>
